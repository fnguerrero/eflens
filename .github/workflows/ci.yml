name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu runners have Docker: SQL Server tests must run there, never be skipped.
          - os: ubuntu-latest
            require-docker: "1"
          # Windows runners only run Windows containers, so the SQL Server tests skip themselves.
          - os: windows-latest
            require-docker: "0"
    runs-on: ${{ matrix.os }}
    env:
      EFLENS_REQUIRE_DOCKER: ${{ matrix.require-docker }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --report-trx --coverage --results-directory TestResults

      - name: Check that the package and server.json agree on the version
        run: python eng/version.py

      # The package as users get it: install it like a tool and talk MCP to it over stdio.
      - name: Pack
        run: dotnet pack src/EfLens -c Release -o artifacts

      - name: Smoke test the installed tool
        run: |
          dotnet tool install EfLens --tool-path tools --add-source artifacts --version "$(python eng/version.py)"
          python tests/smoke/smoke.py tools/eflens
        shell: bash

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: package
          path: artifacts/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
